<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HA Screen</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a2030; color: #e9edf5; font: 16px/1.5 sans-serif; }
    main { max-width: 34rem; padding: 1.5rem; }
    h1 { margin: 0 0 0.5rem; font-size: 1.4rem; }
    code { display: block; margin-top: 0.75rem; padding: 0.75rem; border-radius: 0.5rem; background: #232b3e; color: #ffb547; word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <h1>No page set yet</h1>
    <p>Choose what this screen shows, from a computer with adb:</p>
    <code>adb shell am start -n io.github.nspanelhascreen/.MainActivity --es url http://homeassistant.local:8123/</code>
  </main>
</body>
</html>
